<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Billing Statement Generator for Filipino Freelancers</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="storage-banner" class="messages-warnings" role="status" hidden></div>
  <header class="topbar">
    <h1>Billing Statement Generator</h1>
    <nav id="topbar-actions" aria-label="Document actions"></nav>
  </header>

  <main class="layout">
    <form id="sheet" class="sheet" aria-label="Invoice" novalidate></form>

    <aside id="sidebar" class="sidebar" aria-label="Settings">
      <div class="download-bar">
        <button type="button" id="download" class="primary">Download PDF</button>
      </div>

      <div id="messages">
        <div id="validation"></div>
        <p id="download-error" role="status"></p>
      </div>

      <div class="settings">
        <div class="setting">
          <label for="set-mode">Mode</label>
          <select id="set-mode" data-setting="mode"></select>
        </div>
        <div class="setting">
          <label for="set-currency">Currency</label>
          <select id="set-currency" data-setting="currency" aria-describedby="currency-help"></select>
        </div>
        <div class="setting">
          <label for="set-locale">Format</label>
          <select id="set-locale" data-setting="locale"></select>
        </div>
        <div class="setting">
          <label for="set-paper">Paper</label>
          <select id="set-paper" data-setting="paper">
            <option value="A4">A4</option>
            <option value="LETTER">Letter</option>
          </select>
        </div>
        <p id="currency-help" class="help">Changing currency doesn't convert amounts.</p>
        <fieldset class="setting display-style">
          <legend>Show currency as</legend>
          <label><input type="radio" name="currencyDisplay" value="symbol" data-setting="currencyDisplay"> Symbol</label>
          <label><input type="radio" name="currencyDisplay" value="code" data-setting="currencyDisplay"> Code</label>
        </fieldset>
        <p id="currency-note" class="help" hidden></p>
      </div>

      <div id="sidebar-actions"></div>

      <p id="data-note" class="help"></p>
    </aside>
  </main>

  <footer id="app-footer"></footer>

  <input type="file" id="import-file" class="visually-hidden" accept=".json,application/json" tabindex="-1" aria-hidden="true">

  <dialog id="history-dialog" aria-labelledby="history-title">
    <h2 id="history-title">History</h2>
    <p class="help">History keeps up to 50 documents without logo or QR images. Opening one uses your current default images.</p>
    <p id="history-status" class="history-status" role="status"></p>
    <p id="history-empty" class="help" hidden>No downloads yet.</p>
    <div id="history-list" class="history-scroll">
      <table aria-labelledby="history-title">
        <thead>
          <tr>
            <th scope="col">Number</th>
            <th scope="col">BIR Invoice No.</th>
            <th scope="col">Bill To</th>
            <th scope="col">Date</th>
            <th scope="col">Balance due</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="history-rows"></tbody>
      </table>
    </div>
    <div class="dialog-actions">
      <button type="button" id="history-csv">Export history as CSV</button>
      <button type="button" id="history-clear">Clear history</button>
      <button type="button" id="history-close">Close</button>
    </div>
  </dialog>
</body>
</html>
